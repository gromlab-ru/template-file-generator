name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Версия npm с поддержкой Trusted Publishing
        run: npm install --global npm@11.16.0
      - name: Проверка тега и наличия версии в реестре
        id: release
        run: node scripts/check-release.cjs
      - name: Установка и сборка
        if: steps.release.outputs.published == 'false'
        run: npm ci
      - name: Проверки и публикация через OIDC
        if: steps.release.outputs.published == 'false'
        # prepublishOnly выполняет сборку, тесты и проверку установленного tarball.
        run: npm publish --access public --tag "${{ steps.release.outputs.dist_tag }}"
